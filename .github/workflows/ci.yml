name: RAG checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DEEPSEEK_API_KEY: ""
      LLM_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - run: python -m pip install -r requirements.lock
      - run: python -m unittest discover -s tests -v
      - name: Check cached source and offline RAG
        run: |
          python -m trendee.cli info
          python -m trendee.cli write "为什么中国出海品牌需要进行 GEO 优化？" --mode offline --output outputs/ci-blog.json
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --check web/app.js
