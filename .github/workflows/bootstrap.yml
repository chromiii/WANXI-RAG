name: Bootstrap WANXI-RAG source

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bootstrap.yml'
      - '.bootstrap/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  expand-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Reassemble source payload
        shell: bash
        run: |
          set -euo pipefail
          test "$(find .bootstrap -name 'payload.*.b64' -type f | wc -l)" -eq 6
          cat .bootstrap/payload.*.b64 | base64 --decode > /tmp/wanxi_core_payload.tar.gz
          echo "e1f313d930a5df846a21fc58c8aa2dd6ed3688519985773603d60d88bf0290bd  /tmp/wanxi_core_payload.tar.gz" | sha256sum -c -
          tar -xzf /tmp/wanxi_core_payload.tar.gz
          test -f trendee/service.py
          test -f data/brand_pages.json
          test -f tests/test_acceptance.py

      - name: Install locked dependencies
        run: python -m pip install -r requirements.lock

      - name: Run acceptance tests
        run: python -m unittest discover -s tests -v

      - name: Smoke test offline RAG
        run: |
          python -m trendee.cli info
          python -m trendee.cli write "为什么中国出海品牌需要进行 GEO 优化？" --mode offline --output outputs/bootstrap-blog.json

      - name: Check frontend syntax
        run: node --check web/app.js

      - name: Commit verified workspace
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .bootstrap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "feat: import verified WANXI RAG cloud workspace"
          git push origin HEAD:main
